name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run reproducible public semantic suite
        run: >-
          python -m pytest -q
          tests/test_actions.py
          tests/test_authentic_models.py
          tests/test_authentic_policy.py
          tests/test_authentic_site_rounds.py
          tests/test_claim_boundaries.py
          tests/test_delayed_sdaif.py
          tests/test_fusion.py
          tests/test_intrusion.py
          tests/test_local_normals.py
          tests/test_pilot_schema.py
          tests/test_pressure_features.py
          tests/test_sdaif.py
          tests/test_source_localization.py
          tests/test_source_placement.py
