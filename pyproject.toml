[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nadi-water-safety"
version = "0.1.0"
description = "Software-first Network-Adaptive Decision Intelligence for water-safety testing"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "pandas==2.3.3",
  "openpyxl==3.1.5",
  "pyreadstat==1.3.2",
  "scikit-learn==1.7.2",
  "xgboost==3.1.3",
  "joblib==1.5.2",
  "wntr==1.5.0",
  "pyproj==3.7.1",
  "six==1.17.0",
  "Flask==3.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "nbformat==5.10.4",
  "nbclient==0.10.2",
  "ipykernel==6.29.5",
  "tabulate==0.9.0",
]

[project.scripts]
nadi = "nadi.canonical_cli:main"
nadi-legacy = "nadi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

